name: lightsail-optimization-test

services:
  backend:
    image: qcgz10086/aws-lightsail-backend:test-optimization-20261119
    env_file: .env.test
    volumes:
      - ls_test_data:/data
    environment:
      DATABASE_URL: sqlite:////data/app.db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: qcgz10086/aws-lightsail-frontend:test-optimization-20261119
    ports:
      - "127.0.0.1:${TEST_HTTP_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ls_test_data:
