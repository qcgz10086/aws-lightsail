name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --requirement backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m compileall -q backend/app
      - run: python tools/optimization/test_backend_offline.py
      - run: docker build -t lightsail-backend:ci backend
      - run: docker build -t lightsail-frontend:ci frontend
