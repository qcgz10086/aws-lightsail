# 镜像版部署：不用拉源码、不用本地构建，直接拉 Docker Hub 已发布镜像。
# 用法：把本文件和配好的 .env 放到同一目录，执行
#   docker compose -f docker-compose.image.yml pull
#   docker compose -f docker-compose.image.yml up -d
# 镜像：qcgz10086/aws-lightsail-backend:latest、qcgz10086/aws-lightsail-frontend:latest
#   （对应 billing-getcredits 分支提交 6e3231a；想钉死版本可把 latest 改成 6e3231a）
services:
  backend:
    image: qcgz10086/aws-lightsail-backend:latest
    env_file: .env
    volumes:
      - ls_data:/data
    environment:
      DATABASE_URL: sqlite:////data/app.db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: qcgz10086/aws-lightsail-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ls_data:
